<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>PJAA Work — งานของฉัน</title>
  <style>
    :root{--bg:#f5f7fb;--card:#fff;--text:#15213b;--muted:#7d879a;--blue:#1f67f1;--blue2:#eaf2ff;--orange:#f59e0b;--red:#ef4444;--green:#16a34a;--shadow:0 12px 34px rgba(25,45,88,.08)}
    *{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#eef5ff 0,#f7f9fc 24%,#f5f7fb 100%);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}
    button,input{font:inherit}.app{min-height:100dvh;max-width:560px;margin:0 auto;padding:18px 16px 104px}.hero{padding:16px 2px 10px}.eyebrow{font-size:12px;color:#8a96aa;font-weight:700}.hero h1{font-size:34px;line-height:1.05;margin:8px 0 4px;letter-spacing:-.6px}.hero p{margin:0;color:#8a96aa;font-size:14px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:14px 0}.sum{background:rgba(255,255,255,.94);border:1px solid #e8edf5;border-radius:20px;padding:13px 12px;box-shadow:var(--shadow)}.sum .icon{width:35px;height:35px;border-radius:12px;display:grid;place-items:center;font-size:18px;margin-bottom:8px}.sum.today .icon{background:#e8f1ff}.sum.soon .icon{background:#fff2dc}.sum.late .icon{background:#ffe9eb}.sum span{display:block;font-size:11px;color:#6f7a8d;font-weight:700;white-space:nowrap}.sum b{font-size:28px;line-height:1.1}.toolbar{display:grid;grid-template-columns:1fr 48px;gap:9px;margin:8px 0 10px}.search{height:48px;border:1px solid #dfe6f0;background:#fff;border-radius:16px;padding:0 16px;outline:none}.filterBtn{border:1px solid #dfe6f0;background:#fff;border-radius:16px;font-size:20px}.chips{display:flex;gap:8px;overflow:auto;padding:2px 0 4px;scrollbar-width:none}.chip{border:1px solid #e1e7f0;background:#fff;color:#596579;border-radius:999px;padding:9px 14px;font-size:12px;font-weight:800;white-space:nowrap}.chip.active{background:var(--blue);border-color:var(--blue);color:#fff}.sectionHead{display:flex;justify-content:space-between;align-items:end;margin:18px 2px 10px}.sectionHead h2{font-size:18px;margin:0}.sectionHead span{font-size:12px;color:#8791a3}.list{display:grid;gap:12px}.task{background:var(--card);border:1px solid #e8edf4;border-radius:22px;padding:16px;box-shadow:var(--shadow)}.taskTop,.taskFoot{display:flex;align-items:center;justify-content:space-between;gap:10px}.badge,.status{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:800}.badge{background:#eaf2ff;color:#2466d6}.status.progress{background:#fff0d6;color:#d27a00}.status.review{background:#eaf2ff;color:#2466d6}.status.late{background:#ffe9eb;color:#d92d3a}.task h3{font-size:17px;line-height:1.35;margin:13px 0 7px}.place{font-size:12px;color:#7d879a;margin-bottom:14px}.deadline{display:flex;flex-direction:column;background:#fff0f1;color:#d93f4b;border-radius:14px;padding:9px 11px;min-width:128px}.deadline small{font-size:10px;font-weight:700}.deadline b{font-size:13px}.open{border:0;background:var(--blue);color:#fff;border-radius:14px;padding:12px 16px;font-weight:800;min-width:112px}.empty{padding:40px 20px;text-align:center;color:#8a94a6;background:#fff;border-radius:20px}.nav{position:fixed;z-index:20;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(calc(100% - 24px),536px);height:72px;background:rgba(255,255,255,.96);backdrop-filter:blur(18px);border:1px solid #e1e7ef;border-radius:24px;box-shadow:0 16px 45px rgba(28,42,72,.16);display:grid;grid-template-columns:repeat(4,1fr);padding:6px}.nav button{border:0;background:transparent;color:#7d879a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;font-weight:800}.nav button.active{color:var(--blue)}.nav i{font-style:normal;font-size:20px}.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:#17223c;color:#fff;padding:10px 14px;border-radius:12px;font-size:12px;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    @media(min-width:700px){body{padding:24px}.app{border-radius:32px;background:#f7f9fc;box-shadow:0 30px 90px rgba(24,40,74,.12)}}
  </style>
</head>
<body>
  <main class="app">
    <header class="hero"><div class="eyebrow">PJAA WORK · ผ่าน LINE OA</div><h1>งานของฉัน</h1><p>ดูงานที่ต้องส่ง อัปเดต และติดตามสถานะได้จากมือถือ</p></header>
    <section class="summary">
      <div class="sum today"><div class="icon">📅</div><span>วันนี้</span><b id="todayCount">0</b></div>
      <div class="sum soon"><div class="icon">⏰</div><span>ใกล้ครบกำหนด</span><b id="soonCount">0</b></div>
      <div class="sum late"><div class="icon">!</div><span>เกินกำหนด</span><b id="lateCount">0</b></div>
    </section>
    <div class="toolbar"><input id="search" class="search" placeholder="ค้นหาชื่องาน พื้นที่ หรือหน่วยงาน"/><button class="filterBtn" id="filterBtn">☷</button></div>
    <div class="chips" id="chips">
      <button class="chip active" data-filter="all">ทั้งหมด</button><button class="chip" data-filter="urgent">ด่วน</button><button class="chip" data-filter="soon">ใกล้ครบ</button><button class="chip" data-filter="late">ค้าง</button>
    </div>
    <div class="sectionHead"><h2>รายการงาน</h2><span id="resultCount"></span></div>
    <section class="list" id="taskList"></section>
  </main>
  <nav class="nav"><button><i>⌂</i>หน้าหลัก</button><button class="active"><i>☷</i>งานของฉัน</button><button><i>↺</i>ประวัติ</button><button><i>♙</i>โปรไฟล์</button></nav>
  <div class="toast" id="toast">หน้ารายละเอียดงานจะทำใน Step 2</div>
  <script>
    const tasks=[
      {id:1,category:'งานเอกสาร',title:'จัดทำรายงานผลการดำเนินงาน ประจำไตรมาส 3/2569',place:'ภาค 4 · เขต 4',due:'2026-09-10T18:00:00',status:'กำลังดำเนินการ',tone:'progress',urgent:false},
      {id:2,category:'กำลังพล',title:'ตรวจสอบและยืนยันข้อมูลกำลังพล ประจำเดือนกันยายน 2569',place:'ภาค 4 · เขต 4',due:'2026-09-11T16:30:00',status:'รอตรวจ',tone:'review',urgent:true},
      {id:3,category:'งานแผน/งบประมาณ',title:'จัดส่งแผนการใช้งบประมาณ ประจำปี 2570',place:'ภาค 4 · เขต 4',due:'2026-09-09T16:30:00',status:'เกินกำหนด',tone:'late',urgent:true},
      {id:4,category:'เอกสารพนักงาน',title:'ส่งรายชื่อพนักงานเข้าอบรม พ.ร.บ.รปภ.',place:'ภาค 4 · เขต 4/1',due:'2026-09-12T13:00:00',status:'กำลังดำเนินการ',tone:'progress',urgent:false}
    ];
    const now=new Date('2026-09-10T17:00:00+07:00');let active='all';
    const isLate=t=>new Date(t.due)<now; const isToday=t=>new Date(t.due).toDateString()===now.toDateString(); const isSoon=t=>{const d=(new Date(t.due)-now)/86400000;return d>=0&&d<=2};
    const fmt=t=>new Intl.DateTimeFormat('th-TH',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}).format(new Date(t.due)).replace(' น.','');
    function render(){const q=document.getElementById('search').value.trim().toLowerCase();let data=tasks.filter(t=>(t.title+t.category+t.place).toLowerCase().includes(q));if(active==='urgent')data=data.filter(t=>t.urgent);if(active==='soon')data=data.filter(isSoon);if(active==='late')data=data.filter(isLate);
      document.getElementById('todayCount').textContent=tasks.filter(isToday).length;document.getElementById('soonCount').textContent=tasks.filter(isSoon).length;document.getElementById('lateCount').textContent=tasks.filter(isLate).length;document.getElementById('resultCount').textContent=`${data.length} รายการ`;
      document.getElementById('taskList').innerHTML=data.length?data.map(t=>`<article class="task"><div class="taskTop"><span class="badge">▣ ${t.category}</span><span class="status ${t.tone}">${t.status}</span></div><h3>${t.title}</h3><div class="place">⌖ ${t.place}</div><div class="taskFoot"><div class="deadline"><small>กำหนดส่ง</small><b>${fmt(t)}</b></div><button class="open" onclick="openTask(${t.id})">${t.tone==='review'?'ดูสถานะ':'เปิดงาน'} →</button></div></article>`).join(''):'<div class="empty">ไม่พบงานที่ตรงกับตัวกรอง</div>';
    }
    function openTask(){const el=document.getElementById('toast');el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1800)}
    document.getElementById('search').addEventListener('input',render);document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');active=b.dataset.filter;render()});document.getElementById('filterBtn').onclick=()=>{document.querySelector('[data-filter="all"]').click()};render();
  </script>
</body>
</html>
