<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#f6f8fb" />
<title>PJAA Work — งานของฉัน</title>
<style>
:root{--bg:#f6f8fb;--card:#fff;--text:#172033;--muted:#7b8493;--line:#e7ebf1;--blue:#1769e8;--blue-soft:#edf4ff;--yellow:#a96d00;--yellow-soft:#fff5dc;--yellow-line:#f6e2a6;--red:#d83b49;--red-soft:#fff0f2;--red-line:#ffd9de;--green:#1d7a46;--green-soft:#eaf8ef;--green-line:#ccebd7;--neutral:#566273;--neutral-soft:#f2f5f8;--neutral-line:#e1e6ec;--shadow:0 8px 28px rgba(26,39,67,.06)}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue","Noto Sans Thai",Tahoma,sans-serif;font-weight:400;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}button,input,textarea{font:inherit}button{cursor:pointer}.icon{width:20px;height:20px;display:block;fill:none;stroke:currentColor;stroke-width:1.85;stroke-linecap:round;stroke-linejoin:round}
.app{min-height:100dvh;max-width:560px;margin:0 auto;padding:20px 16px 108px}.hero{padding:8px 2px 4px}.hero h1{font-size:30px;line-height:1.15;margin:0;font-weight:700;letter-spacing:-.035em}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:18px 0 14px}.sum{background:var(--card);border:1px solid var(--line);border-radius:19px;padding:13px 12px 12px;box-shadow:var(--shadow)}.sum .iconWrap{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;margin-bottom:9px}.sum .icon{width:18px;height:18px}.sum.today .iconWrap{background:var(--green-soft);color:var(--green)}.sum.soon .iconWrap{background:var(--yellow-soft);color:var(--yellow)}.sum.late .iconWrap{background:var(--red-soft);color:var(--red)}.sum span{display:block;font-size:11px;line-height:1.2;color:#717b8b;font-weight:600;white-space:nowrap}.sum b{display:block;margin-top:2px;font-size:26px;line-height:1.05;font-weight:700;letter-spacing:-.03em}.toolbar{display:grid;grid-template-columns:1fr 48px;gap:9px;margin:4px 0 10px}.search{height:48px;border:1px solid #dde3ec;background:#fff;border-radius:15px;padding:0 15px;color:var(--text);font-size:14px;outline:none}.search::placeholder{color:#98a0ad}.filterBtn{height:48px;border:1px solid #dde3ec;background:#fff;border-radius:15px;color:#586274;display:grid;place-items:center}.chips{display:flex;gap:8px;overflow:auto;padding:2px 0 3px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{border:1px solid #e0e5ed;background:#fff;color:#5e6878;border-radius:999px;padding:9px 14px;font-size:12px;font-weight:600;white-space:nowrap}.chip.active{background:var(--blue);border-color:var(--blue);color:#fff}.sectionHead{display:flex;justify-content:space-between;align-items:end;margin:20px 2px 10px}.sectionHead h2{font-size:18px;line-height:1.2;margin:0;font-weight:700}.sectionHead span{font-size:12px;color:#858e9d;font-weight:500}.list{display:grid;gap:11px}.task{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:15px;box-shadow:var(--shadow)}.taskStatusRow{display:flex;justify-content:flex-end;margin-bottom:8px}.status{display:inline-flex;align-items:center;border-radius:999px;padding:6px 9px;font-size:11px;line-height:1;font-weight:600}.status.progress{background:#fff3df;color:#b56e09}.status.review{background:#edf4ff;color:#2466c5}.status.late{background:var(--red-soft);color:var(--red)}.taskMain{display:grid;grid-template-columns:94px minmax(0,1fr);gap:14px;align-items:stretch}.deadline{min-height:0;height:100%;border-radius:17px;padding:9px 7px;display:grid;place-items:center;border:1px solid var(--neutral-line);background:var(--neutral-soft);color:var(--neutral)}.deadline.danger{background:var(--red-soft);color:var(--red);border-color:var(--red-line)}.deadline.soon{background:var(--yellow-soft);color:var(--yellow);border-color:var(--yellow-line)}.deadline.today{background:var(--green-soft);color:var(--green);border-color:var(--green-line)}.deadlineContent{width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;margin:auto}.deadlineIcon{display:grid;place-items:center;margin-bottom:4px}.deadlineIcon .icon{width:14px;height:14px}.deadlineLabel{font-size:10px;line-height:1.2;font-weight:650;margin-bottom:2px}.deadlineDay{font-size:31px;line-height:.98;font-weight:760;letter-spacing:-.04em;margin:2px 0 1px}.deadlineMonthYear{font-size:12px;line-height:1.2;font-weight:650;margin-top:2px}.deadlineTime{font-size:14px;line-height:1.2;font-weight:700;margin-top:5px}.deadlineTime small{font-size:10px;font-weight:550}.taskInfo{min-width:0;display:flex;flex-direction:column}.taskInfo h3{font-size:16px;line-height:1.42;margin:0 0 8px;font-weight:650;letter-spacing:-.02em}.place{display:flex;align-items:center;gap:5px;font-size:12px;line-height:1.3;color:#7e8796;margin-bottom:13px}.place .icon{width:14px;height:14px;flex:0 0 auto}.open{margin-top:auto;align-self:flex-start;min-height:40px;border:0;background:var(--blue);color:#fff;border-radius:13px;padding:0 14px;font-size:12px;font-weight:650;display:inline-flex;align-items:center;gap:7px}.open .icon{width:15px;height:15px}
.nav{position:fixed;z-index:20;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(calc(100% - 24px),536px);height:72px;background:rgba(255,255,255,.96);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid #e1e6ed;border-radius:23px;box-shadow:0 14px 40px rgba(28,42,72,.14);display:grid;grid-template-columns:repeat(4,1fr);padding:6px}.nav button{border:0;background:transparent;color:#7b8493;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10px;font-weight:600}.nav button.active{color:var(--blue)}.nav .icon{width:20px;height:20px}
.detail{display:none;min-height:100dvh;max-width:560px;margin:0 auto;padding:16px 16px 120px}.detail.active{display:block}.app.hidden,.nav.hidden{display:none}.detailTop{display:flex;align-items:center;gap:10px;margin-bottom:14px}.backBtn{width:42px;height:42px;border:1px solid var(--line);border-radius:14px;background:#fff;color:#445064;display:grid;place-items:center}.detailTop h1{font-size:22px;margin:0;font-weight:700}.detailCard,.panel{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}.detailCard{padding:16px}.detailMeta{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.detailTitle{font-size:20px;line-height:1.4;font-weight:700;margin:10px 0}.metaLine{display:flex;align-items:center;gap:7px;color:#737e8e;font-size:13px;margin-top:8px}.metaLine .icon{width:15px;height:15px}.detailDeadline{margin-top:14px;border-radius:18px;padding:13px 14px;display:flex;justify-content:space-between;align-items:center;background:var(--green-soft);color:var(--green);border:1px solid var(--green-line)}.detailDeadline.danger{background:var(--red-soft);color:var(--red);border-color:var(--red-line)}.detailDeadline.soon{background:var(--yellow-soft);color:var(--yellow);border-color:var(--yellow-line)}.deadlineText small{display:block;font-size:11px;font-weight:600}.deadlineText b{display:block;font-size:19px;margin-top:2px}.panel{padding:16px;margin-top:12px}.panel h2{font-size:16px;margin:0 0 12px}.instruction{font-size:14px;line-height:1.65;color:#4f5b6c}.timeline{display:grid;gap:14px}.timeItem{display:grid;grid-template-columns:24px 1fr;gap:10px}.timeDot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--green-soft);color:var(--green);margin-top:1px}.timeDot .icon{width:13px;height:13px}.timeBody b{display:block;font-size:13px}.timeBody span{display:block;font-size:12px;color:#7c8797;margin-top:2px}.composer textarea{width:100%;min-height:110px;border:1px solid #dfe5ed;background:#fbfcfe;border-radius:16px;padding:13px 14px;resize:vertical;outline:none;color:var(--text);font-size:14px}.composer textarea:focus{border-color:#a9c6f4;box-shadow:0 0 0 3px #eaf2ff}.attachRow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.attachBtn{min-height:48px;border:1px solid #dfe5ed;background:#fff;border-radius:14px;color:#5d6878;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:11px;font-weight:600}.attachBtn .icon{width:17px;height:17px}.filePreview{margin-top:10px;border:1px solid var(--line);background:#f8fafc;border-radius:14px;padding:11px 12px;display:none;align-items:center;gap:10px}.filePreview.show{display:flex}.filePreview .icon{color:var(--blue)}.filePreview b{font-size:12px}.filePreview span{font-size:11px;color:#8a93a1;display:block;margin-top:2px}.detailActions{position:fixed;z-index:25;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(calc(100% - 24px),536px);padding:8px;background:rgba(255,255,255,.96);backdrop-filter:blur(18px);border:1px solid #e1e6ed;border-radius:22px;box-shadow:0 14px 40px rgba(28,42,72,.14);display:none;grid-template-columns:1fr 1.25fr;gap:8px}.detailActions.show{display:grid}.secondaryAction,.primaryAction{min-height:52px;border-radius:15px;font-size:13px;font-weight:700}.secondaryAction{border:1px solid #f0c8cd;background:#fff;color:var(--red)}.primaryAction{border:0;background:var(--blue);color:#fff}.toast{position:fixed;z-index:40;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:#172033;color:#fff;padding:10px 14px;border-radius:12px;font-size:12px;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:370px){.app,.detail{padding-left:12px;padding-right:12px}.taskMain{grid-template-columns:88px minmax(0,1fr);gap:11px}.deadlineDay{font-size:29px}.taskInfo h3{font-size:15px}}
</style>
</head>
<body>
<main class="app" id="homeView"><header class="hero"><h1>งานของฉัน</h1></header><section class="summary"><div class="sum today"><div class="iconWrap"><svg class="icon" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg></div><span>วันนี้</span><b id="todayCount">0</b></div><div class="sum soon"><div class="iconWrap"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div><span>ใกล้ครบกำหนด</span><b id="soonCount">0</b></div><div class="sum late"><div class="iconWrap"><svg class="icon" viewBox="0 0 24 24"><path d="M12 3 2.8 20h18.4L12 3Z"/><path d="M12 9v5M12 17.2v.1"/></svg></div><span>เกินกำหนด</span><b id="lateCount">0</b></div></section><div class="toolbar"><input id="search" class="search" placeholder="ค้นหาชื่องาน พื้นที่ หรือหน่วยงาน" /><button class="filterBtn" id="filterBtn"><svg class="icon" viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M10 18h4"/></svg></button></div><div class="chips"><button class="chip active" data-filter="all">ทั้งหมด</button><button class="chip" data-filter="urgent">ด่วน</button><button class="chip" data-filter="soon">ใกล้ครบ</button><button class="chip" data-filter="late">ค้าง</button></div><div class="sectionHead"><h2>รายการงาน</h2><span id="resultCount"></span></div><section class="list" id="taskList"></section></main>
<nav class="nav" id="homeNav"><button><svg class="icon" viewBox="0 0 24 24"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10M9 20v-6h6v6"/></svg><span>หน้าหลัก</span></button><button class="active"><svg class="icon" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="m8 12 2.2 2.2L15.5 9M8 7h8M8 17h8"/></svg><span>งานของฉัน</span></button><button><svg class="icon" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg><span>ประวัติ</span></button><button><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span>โปรไฟล์</span></button></nav>
<section class="detail" id="detailView"><div class="detailTop"><button class="backBtn" onclick="goBack()"><svg class="icon" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button><h1>รายละเอียดงาน</h1></div><div id="detailContent"></div></section>
<div class="detailActions" id="detailActions"><button class="secondaryAction" onclick="reportIssue()">ติดปัญหา / ขอเลื่อน</button><button class="primaryAction" onclick="submitTask()">ส่งงาน</button></div><div class="toast" id="toast"></div>
<script>
const tasks=[{id:1,category:'งานเอกสาร',title:'จัดทำรายงานผลการดำเนินงาน ประจำไตรมาส 3/2569',place:'ภาค 4 · เขต 4',due:'2026-09-10T18:00:00+07:00',status:'กำลังดำเนินการ',tone:'progress',urgent:false,instruction:'จัดทำรายงานผลการดำเนินงานของหน่วยงานในพื้นที่ พร้อมตรวจสอบความครบถ้วนก่อนส่ง',progress:['รับงานแล้ว','ติดต่อหน่วยงานแล้ว','รอเอกสาร 2 คน']},{id:2,category:'กำลังพล',title:'ตรวจสอบและยืนยันข้อมูลกำลังพล ประจำเดือนกันยายน 2569',place:'ภาค 4 · เขต 4',due:'2026-09-11T16:30:00+07:00',status:'รอตรวจ',tone:'review',urgent:true,instruction:'ตรวจสอบจำนวนกำลังพลให้ตรงกับข้อมูลล่าสุด และแนบไฟล์สรุปก่อนส่ง',progress:['รับงานแล้ว','ตรวจสอบข้อมูลแล้ว']},{id:3,category:'งานแผน/งบประมาณ',title:'จัดส่งแผนการใช้งบประมาณ ประจำปี 2570',place:'ภาค 4 · เขต 4',due:'2026-09-09T16:30:00+07:00',status:'เกินกำหนด',tone:'late',urgent:true,instruction:'จัดส่งไฟล์แผนงบประมาณฉบับล่าสุด พร้อมหมายเหตุรายการที่ยังไม่ยืนยัน',progress:['รับงานแล้ว']},{id:4,category:'เอกสารพนักงาน',title:'ส่งรายชื่อพนักงานเข้าอบรม พ.ร.บ.รปภ.',place:'ภาค 4 · เขต 4/1',due:'2026-09-12T13:00:00+07:00',status:'กำลังดำเนินการ',tone:'progress',urgent:false,instruction:'รวบรวมรายชื่อพนักงานที่เข้าเกณฑ์อบรม และตรวจสอบเลขประจำตัวก่อนส่ง',progress:['รับงานแล้ว','รวบรวมรายชื่อแล้ว']}];
const now=new Date();let active='all',selectedTask=null;const isLate=t=>new Date(t.due)<now;const isToday=t=>new Date(t.due).toLocaleDateString('en-CA',{timeZone:'Asia/Bangkok'})===now.toLocaleDateString('en-CA',{timeZone:'Asia/Bangkok'});const isSoon=t=>{const d=(new Date(t.due)-now)/86400000;return d>=0&&d<=2};const deadlineTone=t=>isLate(t)||t.urgent?'danger':isToday(t)?'today':isSoon(t)?'soon':'neutral';const dayText=t=>new Intl.DateTimeFormat('th-TH',{day:'numeric',timeZone:'Asia/Bangkok'}).format(new Date(t.due));const monthYearText=t=>new Intl.DateTimeFormat('th-TH',{month:'short',year:'2-digit',timeZone:'Asia/Bangkok'}).format(new Date(t.due));const fullDate=t=>new Intl.DateTimeFormat('th-TH',{day:'numeric',month:'short',year:'2-digit',timeZone:'Asia/Bangkok'}).format(new Date(t.due));const timeText=t=>new Intl.DateTimeFormat('th-TH',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'Asia/Bangkok'}).format(new Date(t.due)).replace(' น.','');
const icon=name=>{const paths={pin:'<path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/>',chevron:'<path d="m9 18 6-6-6-6"/>',check:'<path d="m5 12 4 4L19 6"/>',image:'<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="m21 15-5-5L5 20"/>',file:'<path d="M6 2h8l4 4v16H6z"/><path d="M14 2v5h5"/>',link:'<path d="M10 13a5 5 0 0 0 7.5.5l2-2a5 5 0 0 0-7-7l-1.1 1"/><path d="M14 11a5 5 0 0 0-7.5-.5l-2 2a5 5 0 0 0 7 7l1.1-1"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',arrow:'<path d="m15 18-6-6 6-6"/>'};return `<svg class="icon" viewBox="0 0 24 24">${paths[name]||''}</svg>`};
function render(){const q=document.getElementById('search').value.trim().toLowerCase();let data=tasks.filter(t=>(t.title+t.category+t.place).toLowerCase().includes(q));if(active==='urgent')data=data.filter(t=>t.urgent);if(active==='soon')data=data.filter(isSoon);if(active==='late')data=data.filter(isLate);document.getElementById('todayCount').textContent=tasks.filter(isToday).length;document.getElementById('soonCount').textContent=tasks.filter(t=>isSoon(t)&&!isToday(t)&&!isLate(t)).length;document.getElementById('lateCount').textContent=tasks.filter(isLate).length;document.getElementById('resultCount').textContent=`${data.length} รายการ`;document.getElementById('taskList').innerHTML=data.map(t=>`<article class="task"><div class="taskMain"><div class="deadline ${deadlineTone(t)}"><div class="deadlineContent"><div class="deadlineIcon">${icon('calendar')}</div><div class="deadlineLabel">กำหนดส่ง</div><div class="deadlineDay">${dayText(t)}</div><div class="deadlineMonthYear">${monthYearText(t)}</div><div class="deadlineTime">${timeText(t)} <small>น.</small></div></div></div><div class="taskInfo"><div class="taskStatusRow"><span class="status ${t.tone}">${t.status}</span></div><h3>${t.title}</h3><div class="place">${icon('pin')}<span>${t.place}</span></div><button class="open" onclick="openTask(${t.id})"><span>${t.tone==='review'?'ดูสถานะ':'เปิดงาน'}</span>${icon('chevron')}</button></div></div></article>`).join('')||'<div class="task">ไม่พบงาน</div>'}
function openTask(id){selectedTask=tasks.find(t=>t.id===id);document.getElementById('homeView').classList.add('hidden');document.getElementById('homeNav').classList.add('hidden');document.getElementById('detailView').classList.add('active');document.getElementById('detailActions').classList.add('show');const t=selectedTask;document.getElementById('detailContent').innerHTML=`<div class="detailCard"><div class="detailMeta"><span class="status ${t.tone}">${t.status}</span><span style="font-size:11px;color:#9099a7">${t.category}</span></div><div class="detailTitle">${t.title}</div><div class="metaLine">${icon('pin')}<span>${t.place}</span></div><div class="detailDeadline ${deadlineTone(t)}"><div class="deadlineText"><small>กำหนดส่ง</small><b>${fullDate(t)}</b></div><strong>${timeText(t)} น.</strong></div></div><div class="panel"><h2>รายละเอียดงาน</h2><div class="instruction">${t.instruction}</div></div><div class="panel"><h2>ความคืบหน้า</h2><div class="timeline">${t.progress.map((p,i)=>`<div class="timeItem"><div class="timeDot">${icon('check')}</div><div class="timeBody"><b>${p}</b><span>${i===t.progress.length-1?'อัปเดตล่าสุด':'บันทึกแล้ว'}</span></div></div>`).join('')}</div></div><div class="panel composer"><h2>อัปเดตความคืบหน้า / ส่งงาน</h2><textarea id="progressText" placeholder="พิมพ์ความคืบหน้า ปัญหา หรือรายละเอียดที่ต้องการแจ้ง..."></textarea><div class="attachRow"><button class="attachBtn" onclick="mockAttach('รูปภาพ')">${icon('image')}<span>แนบรูป</span></button><button class="attachBtn" onclick="mockAttach('รายงาน_Q3.pdf')">${icon('file')}<span>แนบไฟล์</span></button><button class="attachBtn" onclick="mockAttach('ลิงก์')">${icon('link')}<span>เพิ่มลิงก์</span></button></div><div class="filePreview" id="filePreview">${icon('file')}<div><b id="fileName"></b><span>พร้อมแนบไปกับงาน</span></div></div></div>`;window.scrollTo(0,0)}
function goBack(){document.getElementById('detailView').classList.remove('active');document.getElementById('detailActions').classList.remove('show');document.getElementById('homeView').classList.remove('hidden');document.getElementById('homeNav').classList.remove('hidden');selectedTask=null;window.scrollTo(0,0)}function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1800)}function mockAttach(name){document.getElementById('fileName').textContent=name;document.getElementById('filePreview').classList.add('show');toast('เพิ่มรายการแนบแล้ว')}function reportIssue(){toast('Step ถัดไปจะทำฟอร์มติดปัญหา / ขอเลื่อน')}function submitTask(){const text=document.getElementById('progressText')?.value.trim();toast(text?'บันทึกและส่งงานแล้ว':'กรุณาใส่รายละเอียดก่อนส่งงาน')}
document.getElementById('search').addEventListener('input',render);document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');active=b.dataset.filter;render()});document.getElementById('filterBtn').onclick=()=>document.querySelector('[data-filter="all"]').click();render();
</script>
</body>
</html>
